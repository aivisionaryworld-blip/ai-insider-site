name: Sync market news

on:
  schedule:
    - cron: "10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-market-news
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Pull headlines from the configured RSS feeds
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT || 'AIInsider/1.0 (hello@aiinsider.store)' }}
        run: python sync_market_news.py

      - name: Publish only when the feed changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- public_market_news.csv
          if git diff --cached --quiet; then
            echo "No new market news."
            exit 0
          fi
          git commit -m "Sync market news"
          git push origin HEAD:main
